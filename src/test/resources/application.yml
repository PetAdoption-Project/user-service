spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: test
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false

keycloak:
  server-url: http://localhost
  realm: test
  admin-client-id: test-admin
  admin-client-secret: test-secret
  gateway-client-id: test-gateway
  gateway-client-secret: test-secret